<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fallback statico per crawler/unfurl che non eseguono JS (Bing, DuckDuckGo,
         WhatsApp/LinkedIn/Slack, bot AI leggeri) — su rotte non pre-renderizzate
         React Helmet (src/components/SEO.tsx) sovrascrive questi tag dopo
         l'hydration, quindi qui va tenuta la stessa copy della home
         (src/pages/AtlanteHome.tsx) per non avere due fonti di verità. Niente
         canonical/og:url qui: questa stessa shell serve da fallback SPA anche
         per rotte diverse dalla home, e un canonical fisso sulla home sarebbe
         sbagliato per quelle. -->
    <meta
      name="description"
      content="La casa di Rodrigo e Betta: posti particolari provati sul campo, con atmosfera, costi reali e il consiglio onesto se un posto merita il viaggio."
    />
    <meta name="theme-color" content="#f7f0e5" />
    <title>Viaggi reali e posti particolari in Italia e nel mondo | Travelliniwithus</title>
    <meta name="author" content="Travelliniwithus" />
    <meta property="og:site_name" content="Travelliniwithus" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Viaggi reali e posti particolari in Italia e nel mondo | Travelliniwithus"
    />
    <meta
      property="og:description"
      content="La casa di Rodrigo e Betta: posti particolari provati sul campo, con atmosfera, costi reali e il consiglio onesto se un posto merita il viaggio."
    />
    <meta property="og:image" content="https://travelliniwithus.it/og/default.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Travelliniwithus - posti particolari, esperienze reali e consigli di viaggio"
    />
    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Viaggi reali e posti particolari in Italia e nel mondo | Travelliniwithus"
    />
    <meta
      name="twitter:description"
      content="La casa di Rodrigo e Betta: posti particolari provati sul campo, con atmosfera, costi reali e il consiglio onesto se un posto merita il viaggio."
    />
    <meta name="twitter:image" content="https://travelliniwithus.it/og/default.jpg" />
    <meta name="twitter:site" content="@travelliniwithus" />
    <meta name="twitter:creator" content="@travelliniwithus" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Fonts are self-hosted via @fontsource (see src/index.css). Vite bundles
         and hashes the woff2 files; browser discovers them when CSS is parsed.
         A manual preload would need the hashed final path (post-build) and is
         skipped here to avoid 404s. The browser starts the font fetch on first
         CSS parse, which is fast enough on HTTP/2 multiplexed connections. -->

    <!-- Route-specific LCP image preloads are managed from React pages with Helmet.
         Exception: the home poster is preloaded statically because Helmet preloads
         only fire after the lazy route chunk loads — too late for the LCP.
         Deve restare allineato all'immagine `eager` di CinematicHomepage: preloadare
         un file che la home non renderizza costa banda E ritarda l'LCP vero.
         `imagesizes` qui e `sizes` su <OptimizedImage> in BrandCoherentHero devono
         restare IDENTICI: se divergono il browser preloada una variante e poi ne
         scarica una seconda per l'elemento. -->
    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="
        /images/home-journal/hero-impossible-320.avif  320w,
        /images/home-journal/hero-impossible-480.avif  480w,
        /images/home-journal/hero-impossible-768.avif  768w,
        /images/home-journal/hero-impossible.avif     1080w"
      imagesizes="(max-width: 1023px) 80vw, 37vw"
      fetchpriority="high"
    />

          {

            "@id": "https://travelliniwithus.it/#website",

              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://travelliniwithus.it/esplora?q={search_term_string}"

    <style>
      @keyframes twuLoaderPulse {
        0%, 100% { opacity: 0.4; transform: scale(0.98); }
        50% { opacity: 1; transform: scale(1.02); }
      }
      @keyframes twuLineGlow {
        0% { width: 0%; opacity: 0.2; }
        50% { width: 80px; opacity: 1; }
        100% { width: 0%; opacity: 0.2; }
      }
      .twu-preloader-text {
        font-family: 'Fraunces', Georgia, serif;
        font-size: 1.85rem;
        font-weight: 500;
        letter-spacing: -0.02em;
        color: #1a2b3c;
        animation: twuLoaderPulse 2s ease-in-out infinite;
      }
      .twu-preloader-line {
        height: 2px;
        background: linear-gradient(90deg, #c85a32, #d4af37, #c85a32);
        border-radius: 2px;
        animation: twuLineGlow 1.8s ease-in-out infinite;
      }
    </style>
  </head>
  <body style="background-color: #faf7f2; margin: 0; padding: 0;">
    <div id="root">
      <div style="min-height: 100vh; background-color: #faf7f2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;">
        <div className="twu-preloader-text" style="font-family: 'Fraunces', serif; font-size: 1.85rem; color: #1a2b3c;">
          Travellini<span style="font-weight: 700; color: #c85a32;">with</span>us
        </div>
        <div style="font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.26em; color: #6b7280;">
          Rodrigo &amp; Betta
        </div>
        <div style="height: 2px; width: 60px; background: linear-gradient(90deg, #c85a32, #d4af37); border-radius: 2px; margin-top: 4px;"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
