<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Guide e itinerari di coppia nel Sud Italia, scritti dopo averli vissuti: Salento, Puglia, Sicilia. Posti veri, prezzi reali, niente marketing."
    />
    <meta name="theme-color" content="#fafafa" />
    <title>Travelliniwithus</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Fonts are self-hosted via @fontsource (see src/index.css). Vite bundles
         and hashes the woff2 files; browser discovers them when CSS is parsed.
         A manual preload would need the hashed final path (post-build) and is
         skipped here to avoid 404s. The browser starts the font fetch on first
         CSS parse, which is fast enough on HTTP/2 multiplexed connections. -->

    <!-- Route-specific LCP image preloads are managed from React pages with Helmet.
         Exception: the home poster is preloaded statically because Helmet preloads
         only fire after the lazy route chunk loads — too late for the LCP. -->
    <link rel="preload" as="image" href="/images/reels/reel-3-cover.webp" fetchpriority="high" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://travelliniwithus.it/#organization",
            "name": "Travelliniwithus",
            "url": "https://travelliniwithus.it",
            "logo": {
              "@type": "ImageObject",
              "url": "https://travelliniwithus.it/pwa-512x512.png",
              "width": 512,
              "height": 512
            },
            "description": "Sito editoriale travel italiano di Rodrigo e Betta. Guide pratiche per coppie con dettagli verificabili e nessun marketing.",
            "founder": [
              { "@id": "https://travelliniwithus.it/#rodrigo" },
              { "@id": "https://travelliniwithus.it/#betta" }
            ],
            "knowsAbout": [
              "viaggi in Italia",
              "destinazioni Sud Italia",
              "borghi italiani",
              "itinerari di coppia",
              "hotel boutique",
              "guide pratiche viaggio",
              "travel editorial"
            ],
            "areaServed": {
              "@type": "Country",
              "name": "Italia",
              "sameAs": "https://www.wikidata.org/wiki/Q38"
            },
            "sameAs": [
              "https://www.instagram.com/travelliniwithus/",
              "https://www.tiktok.com/@travellini.withus",
              "https://www.facebook.com/travelwithuss/"
            ]
          },
          {
            "@type": "Person",
            "@id": "https://travelliniwithus.it/#rodrigo",
            "name": "Rodrigo",
            "url": "https://travelliniwithus.it/chi-siamo",
            "jobTitle": "Travel creator, fotografo e autore editoriale",
            "nationality": "IT",
            "knowsLanguage": ["it", "en"],
            "knowsAbout": [
              "viaggi in coppia",
              "Sud Italia",
              "isole minori italiane",
              "hotel boutique",
              "fotografia di viaggio"
            ],
            "worksFor": { "@id": "https://travelliniwithus.it/#organization" },
            "sameAs": [
              "https://www.instagram.com/travelliniwithus/",
              "https://www.tiktok.com/@travellini.withus",
              "https://www.facebook.com/travelwithuss/"
            ]
          },
          {
            "@type": "Person",
            "@id": "https://travelliniwithus.it/#betta",
            "name": "Betta",
            "url": "https://travelliniwithus.it/chi-siamo",
            "jobTitle": "Travel creator, scrittrice e autrice editoriale",
            "nationality": "IT",
            "knowsLanguage": ["it", "en"],
            "knowsAbout": [
              "viaggi narrativi",
              "borghi italiani",
              "food editorial",
              "Estero raccontato da italiani",
              "destinazioni culturali"
            ],
            "worksFor": { "@id": "https://travelliniwithus.it/#organization" },
            "sameAs": [
              "https://www.instagram.com/travelliniwithus/",
              "https://www.tiktok.com/@travellini.withus",
              "https://www.facebook.com/travelwithuss/"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://travelliniwithus.it/#website",
            "url": "https://travelliniwithus.it",
            "name": "Travelliniwithus",
            "inLanguage": "it-IT",
            "description": "Travelliniwithus racconta posti particolari, esperienze memorabili e consigli utili da salvare e vivere davvero.",
            "publisher": { "@id": "https://travelliniwithus.it/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": {
                "@type": "EntryPoint",
                "urlTemplate": "https://travelliniwithus.it/esplora?q={search_term_string}"
              },
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
