<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Travelliniwithus racconta posti particolari, esperienze memorabili e consigli utili da salvare e vivere davvero."
    />
    <meta name="theme-color" content="#fafafa" />
    <title>Travelliniwithus</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Fonts are self-hosted via @fontsource (see src/index.css). Vite bundles
         and hashes the woff2 files; browser discovers them when CSS is parsed.
         A manual preload would need the hashed final path (post-build) and is
         skipped here to avoid 404s. The browser starts the font fetch on first
         CSS parse, which is fast enough on HTTP/2 multiplexed connections. -->

    <!-- LCP image preload (hero). Matches <picture> sources in HeroBackdrop. -->
    <link
      rel="preload"
      as="image"
      href="/images/hero-amalfi.avif"
      type="image/avif"
      media="(max-width: 768px)"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/brand/couple-travel.avif"
      type="image/avif"
      media="(min-width: 769px)"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
