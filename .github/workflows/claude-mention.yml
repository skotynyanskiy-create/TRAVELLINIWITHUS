name: Claude on mention

# Canale "lavoro da telefono": commenti "@claude ..." su una issue o una PR
# dall'app GitHub, e Claude lavora su un branch e apre/aggiorna la PR.
#
# Complementare a claude-review.yml, che invece è passivo e recensisce ogni PR
# all'apertura. Qui il prompt NON è fissato nel file: viene dal commento, quindi
# l'action opera in tag mode e legge da sola CLAUDE.md del repo.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Due "@claude" di fila sulla stessa issue non devono correre sullo stesso branch.
concurrency:
  group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude
    runs-on: ubuntu-latest
    # Il gate che conta è author_association: senza, chiunque passi di qui
    # potrebbe far girare Claude sul repo e consumare budget API commentando.
    # OWNER = tu. Le altre due servono se un giorno aggiungi qualcuno.
    if: |
      contains(github.event.comment.body, '@claude')
      && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Stessa convenzione di claude-review.yml: dormiente e verde finché la
      # chiave non è nei secrets, così non fallisce mai un check per assenza.
      - name: Check for API key
        id: key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY not set — skipping. Add it in repo Settings → Secrets to activate."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude
        if: ${{ steps.key.outputs.present == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Più alto di --max-turns 8 della review: qui Claude deve leggere,
          # modificare e committare, non solo commentare un diff.
          claude_args: "--max-turns 25"
