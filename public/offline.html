<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f0e5" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Sei offline — Travelliniwithus</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      :root {
        --color-sand: #f7f0e5;
        --color-ink: #1c1a17;
        --color-accent: #b08b63;
        --color-accent-soft: #f1e6d6;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family:
          'Plus Jakarta Sans',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        background: var(--color-sand);
        color: var(--color-ink);
        -webkit-font-smoothing: antialiased;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .logo {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: 28px;
        letter-spacing: -0.01em;
        margin-bottom: 24px;
      }
      .logo b {
        color: var(--color-accent);
        font-weight: 700;
      }
      h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-size: clamp(2.25rem, 6vw, 3.75rem);
        line-height: 1.05;
        font-weight: 500;
        margin: 0 0 16px;
        max-width: 720px;
      }
      p {
        max-width: 540px;
        margin: 0 0 32px;
        font-size: 1.05rem;
        line-height: 1.6;
        color: rgba(28, 26, 23, 0.72);
      }
      .pill {
        display: inline-block;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.28em;
        color: var(--color-accent);
        background: var(--color-accent-soft);
        border-radius: 9999px;
        padding: 8px 16px;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: var(--color-ink);
        color: #fff;
        border: 0;
        cursor: pointer;
        text-decoration: none;
        padding: 14px 28px;
        border-radius: 9999px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        transition: background 0.2s ease;
      }
      .btn:hover {
        background: var(--color-accent);
      }
      .hint {
        margin-top: 24px;
        font-size: 12px;
        color: rgba(28, 26, 23, 0.45);
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="logo">Travellini<b>with</b>us</div>
      <span class="pill">Connessione assente</span>
      <h1>Sei offline.</h1>
      <p>
        Non riusciamo a caricare questa pagina senza rete. Appena la connessione torna,
        ricaricala per riprendere a leggere — i contenuti precedenti restano disponibili.
      </p>
      <button class="btn" onclick="location.reload()" type="button">Riprova</button>
      <p class="hint">Travelliniwithus · Posti particolari, raccontati con criterio.</p>
    </main>
  </body>
</html>
